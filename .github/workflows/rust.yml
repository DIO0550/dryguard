name: Rust

# 強制力の序列で層 1（無条件に効く）。git hooks（層 2）と Claude Code hooks（層 3）は
# 実行環境によっては同時に抜けるため、ここが唯一の無条件のゲートになる
# （harness/githooks/README.md「配線の穴と、それを誰が塞ぐか」）。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      # アクションは commit hash で固定する。
      #
      # Why: タグは動かせるので、`@v5` のままだと同じ設定でも別のコードが走りうる。
      # ここは無条件のゲートなので、何が走るかを固定できないと検査そのものが信用できない。
      # 更新するときは hash とコメントの版を両方直す。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Why not（dtolnay/rust-toolchain）: 公式ではないため。
      # ランナーには rustup が入っているので、直接呼べば足りる。
      - name: Rust ツールチェーン
        run: |
          rustup update --no-self-update stable
          rustup default stable
          # rust-src: rust-analyzer はこれが無いと std / core の型名・トレイト名に
          # definition の答えを返さない。型シグネチャが「測れない」に倒れ、実サーバテストが落ちる
          rustup component add rustfmt clippy rust-src
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # Why not（キャッシュ）: 依存は clap と tree-sitter 系の 2 系統だけで、grammar の
      # C コンパイルを含めてもビルドからテストまで数十秒で終わる。`actions/cache` を
      # 足しても縮む時間より、キー設計と復元漏れの面倒のほうが大きい。遅くなってから入れる。

      # 1 つずつ独立したステップにする。&& で連ねると途中の出力が流れて
      # 末尾しか見えず、どの検査で落ちたのかを読み違える。
      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # 公開項目の doc から非公開項目へ intra-doc link を張ると、リンクが解決しない。
      # 他の rustdoc の警告までは落とさない（`broken_intra_doc_links` が 1 件残っている）。
      - name: cargo doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D rustdoc::private_intra_doc_links

      - name: cargo test
        run: cargo test

      # LSP サーバを要するテストは #[ignore] を付けてあり、開発機では飛ばされる。
      # **無条件に走らせる場所はここしか無い**（AGENTS.md「強制力の序列」の層 1 /
      # rules/testing.md「LSP を要するテストは、飛ばしたことが分かる形にする」）。
      #
      # pnpm はランナーに入っていないので、このアクションが用意する。
      # 入れる版は package.json の `packageManager` が持つ（アクションがそこを読む）。
      #
      # **このアクションで固定できるのは 2 段のうち 1 段目まで。**
      # 1 段目（bootstrap）は同梱の package-lock.json で integrity 込みに固定され、
      # その lock は commit hash で止めたこのアクションに含まれる。
      # 2 段目（`pnpm self-update <版>`）は**版だけを指定して registry から取る**
      # （`packageManager` に付けた `+sha512...` はアクション側が捨てる）。
      # したがって**実際に走る pnpm の中身は固定できていない**。
      #
      # Why not（curl + sha256sum で取る）: 中身まで固定できるが、版を上げるたびに
      # ハッシュを取り直すことになる。手間と引き換えに 2 段目の固定を手放した。
      #
      # Why not（corepack）: Node 25.0.0 から同梱されなくなった。それ以降に corepack を
      # 入れる公式の方法は `npm install -g corepack` で、npm を使わない方針と衝突する。
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: LSP サーバ
        run: |
          # 宣言した版が入ったことを確かめる。2 段目は版指定で取ってくるので、
          # 別の版が入っても黙って進んでしまう（AGENTS.md「強制力の序列」）。
          expected_pnpm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          test "$(pnpm --version)" = "$expected_pnpm_version"
          # lock から入れるだけなので解決は起きない。cooldown は lock を作り直すときに
          # harness/deps/resolve-node.sh が効かせる。
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          node_modules/.bin/typescript-language-server --version

      - name: rust-analyzer
        run: |
          # 版と配布物の中身を固定する。開発機と同じバイナリで実サーバテストを走らせる。
          curl --fail --location --silent --show-error --retry 3 \
            --output rust-analyzer.gz \
            https://github.com/rust-lang/rust-analyzer/releases/download/2026-09-21/rust-analyzer-x86_64-unknown-linux-gnu.gz
          echo 'b2d24ce2bda2ea05b1ad7c2917d205f8111775f703ccd908e6061803ae8257d0  rust-analyzer.gz' | sha256sum --check
          gzip --decompress rust-analyzer.gz
          chmod +x rust-analyzer
          echo "$PWD" >> "$GITHUB_PATH"
          ./rust-analyzer --version

      # ランナーのイメージに入っている Swift の sourcekit-lsp を使う。
      #
      # **残った緩み: 版をこちらで固定できない。** イメージの更新で Swift の版が変わり、
      # rust-analyzer のように sha256 で中身を固定する形と揃わない。版が変わって
      # 実サーバテストが落ちたら、swift.org のツールチェーンを sha256 で固定して取る形に移る。
      #
      # Why not（swift.org の tar.gz を sha256 で固定する）: 6.4.2 で 1 GB を超え、毎回の取得が重い。
      # Why not（swift-actions/setup-swift）: 公式以外を使う理由が無い。
      #
      # sourcekit-lsp には `--version` が無い（6.4.2 で Unknown option）。版は swift から読み、
      # sourcekit-lsp は起動できることだけを確かめる。
      #
      # イメージは swift だけを PATH に出し、sourcekit-lsp を出さない（6.4.1 のイメージで
      # `command -v sourcekit-lsp` が落ちた）。swift の実体と同じツールチェーンの bin から取る。
      - name: sourcekit-lsp
        run: |
          swift --version
          swift_bin="$(dirname "$(readlink -f "$(command -v swift)")")"
          test -x "$swift_bin/sourcekit-lsp"
          echo "$swift_bin" >> "$GITHUB_PATH"
          "$swift_bin/sourcekit-lsp" --help > /dev/null

      # jdtls は配布物の `bin/jdtls`（Python 3 のラッパ）で起動する。ラッパは JAVA_HOME の java を選び、
      # 21 より前なら起動を断る（1.63.0 の `jdtls.py`）。ランナーの既定の java は 21 とは限らないので、
      # イメージが持つ 21 を JAVA_HOME に出す。
      #
      # Why not（actions/setup-java）: ランナーのイメージに JDK 21 が入っているので、取ってくる段を増やさない。
      - name: jdtls
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_21_X64/bin/java" -version
          python3 --version
          # 版と配布物の中身を固定する（rust-analyzer と同じ形）。
          curl --fail --location --silent --show-error --retry 3 \
            --output jdtls.tar.gz \
            https://download.eclipse.org/jdtls/milestones/1.63.0/jdt-language-server-1.63.0-202610191322.tar.gz
          echo 'b1f2abe0b3cccb462cf64fb4a5587c7d09df60cf8be7748b152cbd89d018bdc4  jdtls.tar.gz' | sha256sum --check
          # チェックアウトの外に展開する。リポジトリの下に置くと、ソースを走査するテストの対象に入りうる
          jdtls_home="$RUNNER_TEMP/jdtls"
          mkdir "$jdtls_home"
          tar --extract --gzip --file jdtls.tar.gz --directory "$jdtls_home"
          test -x "$jdtls_home/bin/jdtls"
          echo "$jdtls_home/bin" >> "$GITHUB_PATH"

      # TEMPORARY(#394): 生のメッセージを時刻付きで記録する。実測を Issue に書いたら消す。
      - name: jdtls probe (temporary)
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json, subprocess, sys, time, os, threading, tempfile, queue
          root = os.path.abspath(sys.argv[1]); target = os.path.abspath(sys.argv[2])
          lines = [int(x) for x in sys.argv[3].split(",")]
          data = tempfile.mkdtemp()
          t0 = time.time()
          p = subprocess.Popen(["jdtls", "-data", data], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=open(data + ".stderr", "w"))
          q = queue.Queue(); last = [time.time()]; gaps = []
          def reader():
              f = p.stdout
              while True:
                  h = {}
                  while True:
                      l = f.readline()
                      if not l: q.put(None); return
                      l = l.decode(errors="replace").rstrip("\r\n")
                      if not l and h: break
                      if ":" in l and l.split(":", 1)[0].lower() in ("content-length", "content-type"):
                          k, v = l.split(":", 1); h[k.lower()] = v.strip()
                      else:
                          print("%7.2f RAW STDOUT: %r" % (time.time() - t0, l[:2000]), flush=True)
                  body = f.read(int(h["content-length"]))
                  now = time.time(); gaps.append((now - last[0], now - t0)); last[0] = now
                  q.put(json.loads(body))
          threading.Thread(target=reader, daemon=True).start()
          nid = [0]; waits = []; counts = {}
          def send(m):
              b = json.dumps(m).encode(); p.stdin.write(b"Content-Length: %d\r\n\r\n" % len(b) + b); p.stdin.flush()
          def log(m): print("%7.2f %s" % (time.time() - t0, json.dumps(m, ensure_ascii=False)[:4000]), flush=True)
          def req(method, params):
              nid[0] += 1; i = nid[0]; send({"jsonrpc": "2.0", "id": i, "method": method, "params": params})
              ts = time.time()
              while True:
                  m = q.get()
                  if m is None: print("CLOSED"); sys.exit(1)
                  if "method" in m:
                      counts[m["method"]] = counts.get(m["method"], 0) + 1
                      if m["method"] != "window/logMessage": log(m)
                      if "id" in m:
                          if m["method"] == "window/workDoneProgress/create": send({"jsonrpc": "2.0", "id": m["id"], "result": None})
                          else: send({"jsonrpc": "2.0", "id": m["id"], "error": {"code": -32601, "message": "not supported"}})
                      continue
                  if m.get("id") == i:
                      waits.append((time.time() - ts, method)); print("   %s took %.2fs" % (method, time.time() - ts)); return m
                  log(m)
          uri = lambda path: "file://" + path
          log(req("initialize", {"processId": os.getpid(), "rootUri": uri(root),
              "capabilities": {"window": {"workDoneProgress": True}, "textDocument": {"callHierarchy": {"dynamicRegistration": False}, "hover": {"contentFormat": ["markdown"]}}}}))
          send({"jsonrpc": "2.0", "method": "initialized", "params": {}})
          text = open(target).read()
          send({"jsonrpc": "2.0", "method": "textDocument/didOpen", "params": {"textDocument": {"uri": uri(target), "languageId": "java", "version": 1, "text": text}}})
          src = text.split("\n")
          for rnd in range(3):
              print("=== round", rnd, flush=True)
              for ln in lines:
                  col = src[ln - 1].index("int ") + 4
                  pos = {"textDocument": {"uri": uri(target)}, "position": {"line": ln - 1, "character": col}}
                  for m in ["textDocument/hover", "textDocument/typeDefinition", "textDocument/definition"]:
                      log(req(m, pos))
                  log(req("textDocument/references", dict(pos, context={"includeDeclaration": False})))
                  tcol = src[ln - 1].index("List<") + 1
                  tpos = {"textDocument": {"uri": uri(target)}, "position": {"line": ln - 1, "character": tcol}}
                  for m in ["textDocument/hover", "textDocument/typeDefinition", "textDocument/definition"]:
                      print("   (at List)"); log(req(m, tpos))
                  pr = req("textDocument/prepareCallHierarchy", pos); log(pr)
                  if pr.get("result"):
                      log(req("callHierarchy/outgoingCalls", {"item": pr["result"][0]}))
          print("longest silences", sorted(gaps, reverse=True)[:5])
          print("longest waits", sorted(waits, reverse=True)[:5])
          print("notification counts", counts)
          log(req("shutdown", None)); send({"jsonrpc": "2.0", "method": "exit"}); te = time.time(); p.wait()
          print("exit took %.2f, code %s" % (time.time() - te, p.returncode))
          print("total %.2f" % (time.time() - t0))
          print("stderr tail:"); print(open(data + ".stderr").read()[-3000:])
          PY
          fixture=tests/fixtures/java-lsp
          echo "##### with pom.xml"
          timeout 300 python3 "$RUNNER_TEMP/probe.py" "$fixture" "$fixture/src/main/java/shop/Total.java" 7,12 || true
          standalone="$RUNNER_TEMP/standalone/shop"
          mkdir -p "$standalone"
          cp "$fixture/src/main/java/shop/"*.java "$standalone/"
          echo "##### without pom.xml (root = parent of shop/)"
          timeout 300 python3 "$RUNNER_TEMP/probe.py" "$RUNNER_TEMP/standalone" "$standalone/Total.java" 7,12 || true
          echo "##### ~/.m2"
          find ~/.m2 -maxdepth 4 2>/dev/null | head -50 || true
          echo "##### dryguard"
          cargo test --test java_lsp -- --ignored --nocapture || true
          echo "##### git status"
          git status --porcelain --ignored tests/fixtures/java-lsp

      - name: cargo test (LSP)
        run: cargo test -- --ignored

  claude-hooks:
    # 層 3 のフックそのものは CI では発火しないが、判定が壊れたことはここでしか
    # 無条件に気づけない。壊れたまま入ると、push を取りこぼすか、push でないコマンドまで止める。
    name: Claude Code hooks のテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: pre-push-check
        run: bash .claude/hooks/pre-push-check-test.sh

      - name: hook-canary
        run: bash .claude/hooks/hook-canary-test.sh

      - name: session-url-notice
        run: bash .claude/hooks/session-url-notice-test.sh

      - name: post-merge-review
        run: bash .claude/hooks/post-merge-review-test.sh

      - name: pr-body-check
        run: bash .claude/hooks/pr-body-check-test.sh

      - name: issue-comment-count-check
        run: bash .claude/hooks/issue-comment-count-check-test.sh

      - name: plan-impact-check
        run: bash .claude/hooks/plan-impact-check-test.sh

      # post-edit-rust のテストは使い捨てのクレートに fmt / clippy をかけるので、
      # check ジョブと同じくツールチェーンを明示して用意する。
      - name: Rust ツールチェーン
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: post-edit-rust
        run: bash .claude/hooks/post-edit-rust-test.sh
