name: Rust

# 強制力の序列で層 1（無条件に効く）。git hooks（層 2）と Claude Code hooks（層 3）は
# 実行環境によっては同時に抜けるため、ここが唯一の無条件のゲートになる
# （harness/githooks/README.md「配線の穴と、それを誰が塞ぐか」）。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      # 使うアクションは GitHub 公式（actions/*）のみ。commit hash で固定する。
      #
      # Why: タグは動かせるので、`@v5` のままだと同じ設定でも別のコードが走りうる。
      # ここは無条件のゲートなので、何が走るかを固定できないと検査そのものが信用できない。
      # 更新するときは hash とコメントの版を両方直す。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Why not（dtolnay/rust-toolchain）: 公式ではないため。
      # ランナーには rustup が入っているので、直接呼べば足りる。
      - name: Rust ツールチェーン
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # Why not（キャッシュ）: 依存は clap と tree-sitter 系の 2 系統だけで、grammar の
      # C コンパイルを含めてもビルドからテストまで数十秒で終わる。`actions/cache` を
      # 足しても縮む時間より、キー設計と復元漏れの面倒のほうが大きい。遅くなってから入れる。

      # 1 つずつ独立したステップにする。&& で連ねると途中の出力が流れて
      # 末尾しか見えず、どの検査で落ちたのかを読み違える。
      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # LSP サーバを要するテストは #[ignore] を付けてあり、開発機では飛ばされる。
      # **無条件に走らせる場所はここしか無い**（AGENTS.md「強制力の序列」の層 1 /
      # rules/testing.md「LSP を要するテストは、飛ばしたことが分かる形にする」）。
      #
      # Why（typescript を明示して入れる）: typescript-language-server は tsserver を
      # 包むだけで、TypeScript 本体を同梱しない。TypeScript 7 は tsserver.js を
      # 配らなくなったため、版を指定しないと解決した TypeScript 次第で
      # initialize が失敗する。
      #
      # Why（cooldown を効かせる）: 公開直後の版を解決に使わない。Cargo 側
      # （.cargo/config.toml の global-min-publish-age）と同じ考え方で、
      # 検知・削除までの時間を稼いでから掴む（AGENTS.md「依存の更新は cooldown を通す」）。
      # minimumReleaseAge は分で指定するので、5 日 = 7200。
      #
      # Why（pnpm の版を corepack で固定する）: ランナーに pnpm は入っていない。
      # 版を固定しないと minimumReleaseAge を知らない pnpm が走りうるが、**知らない設定は
      # 警告なく無視される**ので、cooldown が効いていない状態を作れてしまう
      # （AGENTS.md「強制力の序列」のフェイルオープンかつサイレント）。
      # corepack は Node に同梱されているので、追加のインストーラは要らない。
      #
      # Why not（actions/setup-node・pnpm/action-setup）: ランナーに node と corepack が
      # 入っているので、直接呼べば足りる（AGENTS.md「CI で使うアクション」）。
      - name: LSP サーバ
        run: |
          corepack install -g pnpm@10.33.0
          pnpm --version
          export PNPM_HOME="$HOME/.local/share/pnpm"
          mkdir -p "$PNPM_HOME"
          export PATH="$PNPM_HOME:$PATH"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          pnpm config set minimumReleaseAge 7200 --global
          pnpm config get minimumReleaseAge --global
          pnpm add -g typescript-language-server@6.0.0 typescript@5.9.3
          typescript-language-server --version

      - name: cargo test (LSP)
        run: cargo test -- --ignored
