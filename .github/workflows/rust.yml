name: Rust

# 強制力の序列で層 1（無条件に効く）。git hooks（層 2）と Claude Code hooks（層 3）は
# 実行環境によっては同時に抜けるため、ここが唯一の無条件のゲートになる
# （harness/githooks/README.md「配線の穴と、それを誰が塞ぐか」）。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      # 使うアクションは GitHub 公式（actions/*）のみ。commit hash で固定する。
      #
      # Why: タグは動かせるので、`@v5` のままだと同じ設定でも別のコードが走りうる。
      # ここは無条件のゲートなので、何が走るかを固定できないと検査そのものが信用できない。
      # 更新するときは hash とコメントの版を両方直す。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Why not（dtolnay/rust-toolchain）: 公式ではないため。
      # ランナーには rustup が入っているので、直接呼べば足りる。
      - name: Rust ツールチェーン
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # Why not（キャッシュ）: 依存は clap と tree-sitter 系の 2 系統だけで、grammar の
      # C コンパイルを含めてもビルドからテストまで数十秒で終わる。`actions/cache` を
      # 足しても縮む時間より、キー設計と復元漏れの面倒のほうが大きい。遅くなってから入れる。

      # 1 つずつ独立したステップにする。&& で連ねると途中の出力が流れて
      # 末尾しか見えず、どの検査で落ちたのかを読み違える。
      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # LSP サーバを要するテストは #[ignore] を付けてあり、開発機では飛ばされる。
      # **無条件に走らせる場所はここしか無い**（AGENTS.md「強制力の序列」の層 1 /
      # rules/testing.md「LSP を要するテストは、飛ばしたことが分かる形にする」）。
      #
      # Why（pnpm を SHA-256 で固定して取る）: ランナーに pnpm は入っていない。
      # **版だけでなく中身まで固定する**のは、`actions/*` を commit hash で止めているのと
      # 同じ理由（AGENTS.md「CI で使うアクション」）。タグやリリースは差し替えられるが、
      # ハッシュが合わなければ sha256sum -c がステップを落とす。
      #
      # 更新するときは PNPM_VERSION と PNPM_SHA256 の両方を直す
      # （actions の hash とコメントの版を両方直すのと同じ）。
      #
      # Why not（corepack）: Node 25.0.0 から同梱されなくなった。それ以降に corepack を
      # 入れる公式の方法は `npm install -g corepack` で、npm を使わない方針と衝突する。
      #
      # Why not（pnpm の公式インストールスクリプト）: checksum が無く、
      # リモートのスクリプトをそのまま sh に流すことになる。
      - name: LSP サーバ
        run: |
          PNPM_VERSION=10.33.0
          PNPM_SHA256=aa02280c8d6925b43ded806f22a46ba17a44700271ec6b58679bbe1ffe537973
          pnpm_directory="$HOME/.local/bin"
          mkdir -p "$pnpm_directory"
          export PATH="$pnpm_directory:$PATH"
          curl -fsSL -o "$pnpm_directory/pnpm" \
            "https://github.com/pnpm/pnpm/releases/download/v$PNPM_VERSION/pnpm-linuxstatic-x64"
          echo "$PNPM_SHA256  $pnpm_directory/pnpm" | sha256sum -c -
          chmod +x "$pnpm_directory/pnpm"
          pnpm --version
          # lock から入れるだけなので解決は起きない。cooldown は lock を作り直すときに
          # harness/deps/resolve-node.sh が効かせる。
          pnpm install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          node_modules/.bin/typescript-language-server --version

      - name: cargo test (LSP)
        run: cargo test -- --ignored
