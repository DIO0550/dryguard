[package]
name = "dryguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "構造の似たコードが偶発的な重複かどうかを、型・依存・参照の意味情報から理由付きで判定する CLI"
repository = "https://github.com/DIO0550/dryguard"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
# LSP の要求・応答の型だけを借りる（`docs/dryguard-plan.md`「技術スタック」）。
# JSON-RPC のフレーミングと往復は自前で持つ。サーバごとの癖に手が届かなくなるため。
lsp-types = "0.97.0"
# scan の並列化に使う（`docs/dryguard-plan.md`「技術スタック」）。総当たりの仕事量は
# 先頭のチャンクほど大きい三角形なので、等分ではなく作業盗みのある実装に任せる。
rayon = "1.12"
# 受け取った payload の解釈に使う。serde 本体は入れない — こちらで derive するものが無く、
# lsp-types の型は向こうが Serialize / Deserialize を持っている。
serde_json = "1.0.151"
tree-sitter = "0.26"
# grammar は言語ごとに別クレート。Phase 4 で Rust を足すときは
# tree-sitter-rust を並べるだけで済む（`docs/dryguard-plan.md`「技術スタック」）。
tree-sitter-typescript = "0.23"

# 本番コードでの unwrap / expect の禁止は、規約の文ではなくツールで落とす。
# テストコード内は clippy.toml の allow-unwrap-in-tests / allow-expect-in-tests で許可する
# (rules/coding.md「エラーと不在の表現」/ rules/testing.md「テスト内の unwrap / expect」)。
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
